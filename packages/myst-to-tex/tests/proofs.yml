              value: 'Given this, then that.'
        - type: proof
          kind: proof
          label: proof-t1
          identifier: proof-t1
          children:
            - type: text
              value: 'qed.'
    latex: |-
      Some text before a theorem

      \begin{theorem}\label{theo-t1}Given this, then that.\end{theorem}\begin{proof}\label{proof-t1}qed.\end{proof}

[build]
environment = { BUN_VERSION = "latest", NODE_VERSION = "22" }
command = """
  pip install -r docs/requirements.txt;
  bun install;
  bun run build;
  bun run link;
  cd docs;
  myst build --html --execute
  echo "User-agent: *\nDisallow: /" > _build/html/robots.txt
  """
publish = "/docs/_build/html/"
